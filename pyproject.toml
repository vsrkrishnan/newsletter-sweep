[project]
name = "newsletter-sweep"
version = "0.1.0"
description = "An always-on agent that triages newsletters/feeds into a knowledge base you already own — any LLM provider, any source, any sink."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Shiva V" }]
keywords = ["ai-agents", "newsletter", "knowledge-management", "mcp", "notion", "always-on-agent"]

dependencies = [
  "feedparser>=6.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "python-frontmatter>=1.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
newsletter-sweep = "newsletter_sweep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter_sweep"]
